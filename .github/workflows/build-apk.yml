name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web app
        working-directory: web
        run: npx tsc -p .

      - name: Bundle web app into Android assets
        working-directory: web
        run: node build.mjs --out ../android/app/src/main/assets/web

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Signing unit tests (keystore, certificate, AAB signature verified by jarsigner)
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk forge-debug-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forge-debug-apk
          path: forge-debug-${{ github.run_number }}.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Forge build ${{ github.run_number }}
          files: forge-debug-${{ github.run_number }}.apk
          prerelease: true

  # Proves the Google Play wrapper project that Forge generates really builds an AAB.
  verify-play-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build unsigned AAB from generated fixture
        working-directory: fixtures/webapp
        run: gradle bundleRelease --stacktrace --no-daemon
      - name: Check AAB exists
        run: ls -l fixtures/webapp/app/build/outputs/bundle/release/app-release.aab
